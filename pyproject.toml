[project]
name = "aiowallhaven"
version = "0.0.5"
description = "an asynchronous API wrapper for https://wallhaven.cc"
authors = [
    {name = "Dmitrii Efimov", email = "efimov.1992@outlook.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.5",
    "aiolimiter==1.3.0",
    "aiosignal==1.4.0",
    "async-timeout==5.0.1",
    "attrs==26.1.0",
    "frozenlist==1.8.0",
    "idna==3.20",
    "multidict==7.1.0",
    "propcache==0.5.4",
    "typing-extensions==4.16.0",
    "yarl==1.25.1",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"