[project]
name = "aiowallhaven"
version = "0.0.6"
description = "an asynchronous API wrapper for https://wallhaven.cc"
authors = [
    {name = "Dmitrii Efimov", email = "efimov.1992@outlook.com"}
]
license = "MIT"
license-files = ["LICENSE.txt"]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "aiohttp>=3.14.5,<4.0",
    "aiolimiter>=1.3.0,<2.0",
]

[project.urls]
Homepage = "https://github.com/itsuchur/aiowallhaven"
Documentation = "https://aiowallhaven.readthedocs.io/en/latest/"

[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
